<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f4">
  <meta name="description" content="MeteoMNE — zvanični meteo podaci za Crnu Goru, jasno i brzo. Izvor: ZHMS.">
  <title>MeteoMNE — vrijeme u Crnoj Gori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="vrh">
    <span class="wordmark">Meteo<em>MNE</em></span>
    <span class="izvor-mini">Izvor: ZHMS</span>
  </header>

  <main>
    <section class="ekran aktivan" id="ekran-mjesto">
      <button class="mjesto-ime" id="mjesto-ime" aria-haspopup="true">—</button>
      <p class="temp" id="temp">—</p>
      <p class="mjerenje" id="mjerenje">—</p>
      <ul class="parametri" id="parametri"></ul>
    </section>

    <section class="ekran" id="ekran-stanice">
      <p class="gradnja">Stanice — u izgradnji.<br>Slijede: stanje mreže, lista i mapa stanica.</p>
    </section>

    <section class="ekran" id="ekran-prognoza">
      <p class="gradnja">Prognoza — u izgradnji.<br>Slijede: zvanična i računarska prognoza.</p>
    </section>

    <footer class="izvor">Izvor: ZHMS — Zavod za hidrometeorologiju i seizmologiju Crne Gore</footer>
  </main>

  <nav class="tabovi">
    <button class="tab aktivan" data-ekran="mjesto">Moje mjesto</button>
    <button class="tab" data-ekran="stanice">Stanice</button>
    <button class="tab" data-ekran="prognoza">Prognoza</button>
  </nav>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-glava">
      <p class="overlay-naslov">Izaberi mjesto</p>
      <button class="overlay-zatvori" id="overlay-zatvori" aria-label="Zatvori">✕</button>
    </div>
    <input class="pretraga" id="pretraga" type="search" placeholder="Pretraži grad ili stanicu…" autocomplete="off">
    <ul class="lista-mjesta" id="lista-mjesta"></ul>
  </div>
</body>
</html>
