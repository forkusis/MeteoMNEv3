name: Update meteo data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_data.py'
      - '.github/workflows/update.yml'

concurrency:
  group: meteo-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        run: pip install requests

      - name: Sinhronizuj sa origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Pokreni skriptu za povlačenje podataka
        run: python fetch_data.py

      - name: Sačuvaj promjene u repozitorijum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Ažuriranje meteo podataka"
          git push origin main || echo "!! push odbijen (neko je upravo gurnuo izmjene) - sledeci run preuzima."
