name: Update meteo data

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'fetch_data.py'
      - '.github/workflows/update.yml'

concurrency:
  group: meteo-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        run: pip install requests

      - name: Sinhronizuj sa origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Pokreni skriptu za povlačenje podataka
        run: python fetch_data.py

      - name: Sačuvaj promjene u repozitorijum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Ažuriranje meteo podataka"
            PUSHED=0
            for i in 1 2 3 4 5; do
              if git push origin main; then
                PUSHED=1
                echo "Push uspio."
                break
              fi
              echo "Push odbijen (pokusaj $i), rebase pa ponovo..."
              git fetch origin main
              git rebase --strategy-option=theirs origin/main || git rebase --abort
              sleep 3
            done
            if [ "$PUSHED" != "1" ]; then
              echo "!! PUSH NIJE USPIO - podaci nijesu sacuvani. Potreban rucni run."
              exit 1
            fi
          else
            echo "Nema promjena u data/."
          fi
